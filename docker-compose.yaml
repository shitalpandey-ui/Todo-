services:
  backend:
    build: ./backend
    container_name: my-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: your_new_secret_here
      DATABASE_URL: postgresql://admin:ASDF%40098asd@postgres:5432/mydb
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy

  
  postgres:
    image: postgres:16
    container_name: my-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ASDF@098asd
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: