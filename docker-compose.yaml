services:
  backend:
    build:
      context: ./Backend
    container_name: my-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: your_new_secret_here
      DATABASE_URL: postgresql://admin:ASDF%40098asd@postgres:5432/mydb
    volumes:
      - ./Backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    container_name: my-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: my-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ASDF@098asd
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  

volumes:
  pgdata:
  pgadmin_data: